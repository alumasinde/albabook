; Production FPM pool for AlbaBook (docs/deployment.md).
;
; The stock www.conf ships pm.max_children=5 — at ~80ms/request that caps a
; node at ~60 req/s before queueing. 50 children at ~40–80MB RSS each fits a
; 4GB app node with headroom for the DB-adjacent workload; scale replicas,
; not a single giant pool, beyond that.
[www]
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 2000
request_terminate_timeout = 60s
