# Local development server for the AlbaBook hosts (marketing site + four interfaces) (decisions.md D-005).
# Production uses the same rules with real hostnames and TLS.

server {
    listen 80;
    server_name albabook.localhost app.albabook.localhost book.albabook.localhost api.albabook.localhost admin.albabook.localhost;

    # Only public/ is web-reachable (plan.md §29).
    root /var/www/albabook/public;
    index index.php;

    client_max_body_size 12m;
    server_tokens off;

    # Never serve dotfiles (.env, .git) even if one lands in public/.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Booking host: static files live under /_/ so they can never collide
    # with a business slug (decisions.md D-005).
    location ^~ /_/assets/ {
        alias /var/www/albabook/public/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller executes; no other .php file in public/ runs.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ \.php$ {
        return 404;
    }
}

# Any other Host header: reject before PHP (the app rejects it too).
server {
    listen 80 default_server;
    server_name _;
    return 400;
}
