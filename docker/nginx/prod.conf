# Production AlbaBook hosts — TLS, HSTS, real-IP from a trusted edge proxy.
# Mount a certificate covering BOTH albabook.co.ke and *.albabook.co.ke (a
# wildcard alone does not cover the bare domain) at /etc/nginx/tls/.
# HTTP redirects to HTTPS. The bare domain serves the public marketing site
# (APP_HOST_MARKETING); www. redirects to it.
#
# If an upstream load balancer / CDN terminates before nginx, whitelist it so
# REMOTE_ADDR seen by PHP-FPM is the edge address and the app can trust
# X-Forwarded-* per TRUSTED_PROXIES:
#   set_real_ip_from 10.0.0.0/8;
#   set_real_ip_from 172.16.0.0/12;
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;

server {
    listen 80;
    server_name *.albabook.co.ke albabook.co.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # The exact www. name below wins over this wildcard.
    server_name *.albabook.co.ke albabook.co.ke;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:ALBABOOK:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS: TLS-only for every AlbaBook host, including subdomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/albabook/public;
    index index.php;

    client_max_body_size 12m;
    server_tokens off;

    location ~ /\. {
        deny all;
        return 404;
    }

    location ^~ /_/assets/ {
        alias /var/www/albabook/public/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
    }

    location ~ \.php$ {
        return 404;
    }
}

# www. redirects to the bare-domain marketing site.
server {
    listen 443 ssl;
    http2 on;
    server_name www.albabook.co.ke;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://albabook.co.ke$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 400;
}
