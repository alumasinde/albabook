# Production compose for AlbaBook (docs/deployment.md).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml exec app php bin/console migrate
#
# Workers + night audit run via host cron (see docs/deployment.md).

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: 3306
      LOG_CHANNEL: stderr
    volumes:
      - storage-data:/var/www/albabook/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-albabook}
      # Least privilege: the image's MYSQL_USER gets ALL on the database, so
      # it is the schema OWNER, used only by `php bin/console migrate`.
      MYSQL_USER: ${DB_MIGRATE_USERNAME:?DB_MIGRATE_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_MIGRATE_PASSWORD:?DB_MIGRATE_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      # The web app's runtime user (DML only), created by prod-init.sh.
      APP_DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_ALL_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --innodb-lock-wait-timeout=10
      - --log-bin-trust-function-creators=1
    volumes:
      - db-data:/var/lib/mysql
      # Production init: creates the DML-only runtime user. (The dev
      # init.sql — which creates albabook_test — is not mounted here.)
      - ./docker/mysql/prod-init.sh:/docker-entrypoint-initdb.d/01-prod-init.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    restart: unless-stopped

volumes:
  db-data:
  storage-data:
