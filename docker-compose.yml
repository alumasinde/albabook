# Local development: PHP 8.3 FPM + Nginx + MySQL 8.4 (LTS).
#
#   docker compose up -d --build
#   docker compose exec app composer install
#   docker compose exec app php bin/console key:generate
#   docker compose exec app php bin/console migrate
#
# Then open http://app.albabook.localhost:8080 (and book., api., admin.).
# MySQL 8 is required, not MariaDB: the booking engine's lock protocol and the
# migrations depend on MySQL 8 behaviour (decisions.md D-009, D-024).

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./:/var/www/albabook
    environment:
      DB_HOST: db
      DB_PORT: 3306
      LOG_CHANNEL: stderr
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/albabook/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-albabook}
      MYSQL_USER: ${DB_USERNAME:-albabook}
      MYSQL_PASSWORD: ${DB_PASSWORD:-albabook}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-33060}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/albabook.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  db-data:
